[project]
name = "abcd-graph"
version = "0.5.0"
readme = "README.md"
description = "A python library for generating ABCD graphs."
authors = [
    { name = "Aleksander Wojnarowicz", email = "alwojnarowicz@gmail.com" },
    { name = "Jordan Barrett" }
]
license = "MIT"
requires-python = ">=3.12"
packages = [{include = "abcd_graph", from = "src"}]
repository = "https://github.com/AleksanderWWW/abcd-graph"
dependencies = [
    "numba>=0.66.0",
    "numpy>=2.0.0",
    "scipy>=1.18.0",
    "typing-extensions>=4.10.0"
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
markers = [
    "integration: marks tests using external dependencies"
]


[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | \.eggs
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["abcd_graph"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
