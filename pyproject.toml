[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abcd-graph"
version = "0.5.0-beta"
description = "A python library for generating ABCD graphs."
authors = [
    { name = "Aleksander Wojnarowicz", email = "alwojnarowicz@gmail.com" },
    { name = "Jordan Barrett" },
    { name = "Ryan DeWolfe", email = "ryan.dewolfe@uwaterloo.ca" },
]
keywords = ["community detection", "graph clustering", "benchmark", "evaluation", "random graphs"]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
]

requires-python = ">=3.12"
dependencies = [
    "numba>=0.66.0",
    "numpy>=2.0.0",
    "scipy>=1.18.0",
    "powerlaw>=2.0.0",
    "typing-extensions>=4.10.0",
    "tqdm>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "prek",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
]
docs = [
    "matplotlib",
    "jupyterlab_pygments>=0.1.1",
    "ipykernel",
    "nbsphinx",
    "numpydoc",
    "sphinx-rtd-theme",
    "networkx",
    "igraph",
    "partition-sknetwork",
    "egosplit-sknetwork",
]

[project.urls]
Homepage = "https://github.com/AleksanderWWW/abcd-graph"
Repository = "https://github.com/AleksanderWWW/abcd-graph"

[tool.hatch.build.targets.wheel]
packages = ["abcd_graph"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
addopts = ["--strict-markers"]
markers = [
    "integration: marks tests using external dependencies"
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | \.eggs
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008", # Do not perform function call in defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.coverage.run]
source = ["abcd_graph"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
