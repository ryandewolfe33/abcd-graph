---
name: Test
description: Run tests
inputs:
  working_directory:
    description: 'Working directory'
    required: false
    default: .
runs:
    using: "composite"
    steps:
      - name: Run tests
        working-directory: ${{ inputs.working_directory }}
        run: uv run pytest --junitxml=pytest.xml \
                           --cov-report=term-missing:skip-covered \
                           --cov=abcd_graph \
                           tests | tee pytest-coverage.txt
